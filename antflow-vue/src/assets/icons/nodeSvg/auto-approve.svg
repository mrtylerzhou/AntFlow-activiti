<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .main { fill: currentColor; }
            .white { fill: #FFFFFF; }
            .bg-cut { fill: #FFFFFF; } /* 用于切开重叠部分的背景色 */
        </style>
    </defs>

    <!-- 1. 人物部分 -->
    <g id="character">
        <!-- 头像 -->
        <circle class="main" cx="28" cy="16" r="10"/>
        <!-- 身体 -->
        <path class="main" d="
            M10 47
            C10 35 18 28 28 28
            C38 28 46 35 46 47
            L46 50
            C46 52.5 44 54 41.5 54
            L14.5 54
            C12 54 10 52.5 10 50
            Z"/>
    </g>

    <!-- 2. 齿轮部分 (带隔离边框) -->
    <g transform="translate(44, 44)">
        
        <!-- 关键改进：白色背景圆圈，用于产生视觉间隔 -->
        <circle class="bg-cut" cx="0" cy="0" r="17" />

        <!-- 齿轮外齿 -->
        <path class="main" d="
            M0,-10
            L2.4,-9.4 L3.8,-11.4 L6.8,-9.6 L6,-7.2
            L8.5,-6 L10.8,-7.2 L12.5,-4.2 L10.7,-2.8
            L11.2,0 L14,1.2 L13.2,4.4 L10.5,4.2
            L9.5,6.8 L11.2,8.7 L8.8,11 L6.8,9.8
            L4.2,11 L4,14 L0.8,14 L0,11.2
            L-2.8,10.5 L-4.8,12.2 L-7.3,10 L-6.2,7.6
            L-8.5,6 L-11,6.8 L-12.4,3.8 L-10.2,2
            L-10.8,-0.8 L-13.6,-2 L-12.5,-5 L-9.8,-4.8
            L-8.5,-7 L-9.8,-9.2 L-7.2,-11.2 L-4.8,-9.8
            L-2.6,-10.8 Z"/>

        <!-- 齿轮内部白圆 -->
        <circle class="white" cx="0" cy="0" r="7"/>

        <!-- 对勾 -->
        <path
            d="M-3 0 L-1 2.2 L4 -3"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

</svg>