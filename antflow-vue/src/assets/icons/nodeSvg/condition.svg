<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="128"
    height="128"
    viewBox="0 0 128 128">

    <defs>
        <style>
            .main { fill: currentColor; }
            /* 实线样式：中间竖线，保持厚重感 */
            .line-solid { 
                fill: none; 
                stroke: currentColor; 
                stroke-width: 6; 
                stroke-linecap: round; 
                stroke-linejoin: round; 
            }
            /* 虚线样式：左右两侧，保持厚重但清爽 */
            .line-dashed { 
                fill: none; 
                stroke: currentColor; 
                stroke-width: 6; 
                stroke-linecap: butt; 
                stroke-dasharray: 12 10; /* 适配 128 比例的间距 */
            }
        </style>
    </defs>

    <!-- 连接线部分 -->
    <g id="connectors">
        <!-- 1. 中间竖线：实线 -->
        <path class="line-solid" d="M64 30 V94" />
        
        <!-- 2. 左右两侧：虚线 -->
        <!-- 左侧分支 (折线) -->
        <path class="line-dashed" d="M64 62 H20 V94" />
        <!-- 右侧分支 (折线) -->
        <path class="line-dashed" d="M64 62 H108 V94" />
    </g>

    <!-- 节点方块部分 (维持原稿的大尺寸比例) -->
    <g id="nodes">
        <!-- 顶部父节点 -->
        <rect class="main" x="48" y="4" width="32" height="26" rx="4" />
        
        <!-- 底部三个子节点 -->
        <rect class="main" x="4" y="94" width="32" height="26" rx="4" />   <!-- 左 -->
        <rect class="main" x="48" y="94" width="32" height="26" rx="4" />  <!-- 中 -->
        <rect class="main" x="92" y="94" width="32" height="26" rx="4" />  <!-- 右 -->
    </g>

</svg>