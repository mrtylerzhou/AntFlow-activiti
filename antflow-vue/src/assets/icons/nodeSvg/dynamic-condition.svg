<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .main { fill: currentColor; }
            .white { fill: #FFFFFF; }
            /* 连接线样式：保持原稿的厚重感 */
            .connector-solid { 
                fill: none; 
                stroke: currentColor; 
                stroke-width: 4; 
                stroke-linecap: butt; 
            }
            .connector-dashed { 
                fill: none; 
                stroke: currentColor; 
                stroke-width: 4; 
                stroke-linecap: butt; 
                stroke-dasharray: 5 4; /* 虚线效果 */
            }
            .mask-bg { fill: #FFFFFF; }
        </style>
    </defs>

    <!-- 1. 条件节点主体 (基于原稿结构重绘) -->
    <g id="condition-structure">
        
        <!-- 中间主连线 (顶节点 -> 中间子节点)：实线 -->
        <path class="connector-solid" d="M32 10 V40" />

        <!-- 侧边连线 (从主轴分叉到左右子节点)：虚线 -->
        <!-- 左侧分支 -->
        <path class="connector-dashed" d="M32 24 H12 V40" />
        <!-- 右侧分支 -->
        <path class="connector-dashed" d="M32 24 H52 V40" />

        <!-- 节点方块 (保留原稿的矩形比例) -->
        <!-- 顶节点 -->
        <rect class="main" x="24" y="2" width="16" height="12" rx="2" />
        <!-- 底部三个子节点 -->
        <rect class="main" x="4" y="40" width="16" height="12" rx="2" />
        <rect class="main" x="24" y="40" width="16" height="12" rx="2" />
        <rect class="main" x="44" y="40" width="16" height="12" rx="2" />
    </g>

    <!-- 2. 右下角动态螺旋标识 -->
    <g transform="translate(50, 50)">
        <!-- 隔离层：切开右侧节点和虚线末端 -->
        <circle class="mask-bg" cx="0" cy="0" r="14" />
        
        <!-- 橙色圆底 -->
        <circle class="main" cx="0" cy="0" r="11" />
        
