<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .main { fill: #FF850A; }
            .white { fill: #FFFFFF; }
            /* 实线：退回执行路径 */
            .line-solid { 
                fill: none; 
                stroke: #FF850A; 
                stroke-width: 3; 
                stroke-linecap: round; 
                stroke-linejoin: round; 
            }
            /* 虚线：条件判定分支 */
            .line-dashed { 
                fill: none; 
                stroke: #FF850A; 
                stroke-width: 3; 
                stroke-linecap: butt; 
                stroke-dasharray: 6 5;
            }
            /* 隔离遮罩 */
            .mask-bg { fill: #FFFFFF; }
        </style>
    </defs>

    <!-- 1. 条件退回路径结构 (由右向左) -->
    <g id="conditional-return-structure">
        <!-- 连线：中实，下实，上虚 -->
        <!-- 中间主轴连线 -->
        <path class="line-solid" d="M52 32 H14" /> 
        <!-- 上方分支 (虚线) -->
        <path class="line-dashed" d="M42 32 V18 H24" />
        <!-- 下方分支 (实线) -->
        <path class="line-solid" d="M42 32 V46 H24" />

        <!-- 节点方块 (右侧为源，左侧为分支结果) -->
        <!-- 右侧源节点 -->
        <rect class="main" x="48" y="27" width="12" height="10" rx="2" />
        <!-- 左侧三个分支节点 -->
        <rect class="main" x="8" y="13" width="16" height="10" rx="2" />
        <rect class="main" x="8" y="41" width="16" height="10" rx="2" />
        <!-- 中间退回目标由箭头代表 -->
    </g>

    <!-- 2. 左侧核心：退回箭头 (指向左侧) -->
    <g transform="translate(12, 32)">
        <!-- 隔离层：确保箭头尖端与横线之间有清爽留白 -->
        <circle class="mask-bg" cx="0" cy="0" r="8" />
        <!-- 退回箭头尖端 -->
        <path class="main" d="M6 -7 L-4 0 L6 7 L4 0 Z" />
    </g>

    <!-- 3. 右下方：动态螺旋标识 (可选，增加角标以强调"条件驱动") -->
    <g transform="translate(52, 50)">
        <circle class="mask-bg" cx="0" cy="0" r="14" />
        <circle class="main" cx="0" cy="0" r="11" />
        <g transform="scale(0.016) translate(-512, -512)">
            <path class="white" d="M558.996211 67.045053v99.354947l-0.080843 2.883368c-5.551158 88.980211 18.054737 147.941053 69.901474 183.376843 114.903579 84.722526 169.633684 207.952842 165.618526 365.729684l35.84-10.509474 101.322106-38.022737c4.958316 0 9.889684 0 10.940631 3.907369l0.188632 1.643789c5.551158 0 5.551158 5.551158 5.551158 11.129263l-200.218948 255.838316c-5.551158 5.578105-11.129263 5.578105-16.707368 0l-200.218947-255.838316v-11.129263c0-5.551158 5.578105-5.551158 11.129263-5.551158l120.885894 47.265684 38.804211 8.81179c5.928421-133.847579-36.486737-231.639579-126.571789-298.09179l-6.898527-4.877473a235.52 235.52 0 0 1-53.005473-53.544421 234.334316 234.334316 0 0 1-59.957895 63.946105l-6.898527 4.904421c-90.085053 66.425263-132.500211 164.217263-126.571789 298.064842l38.804211-8.811789 120.885894-47.265685c5.551158 0 11.129263 0 11.129263 5.551158v11.129263l-200.218947 255.838316c-5.578105 5.578105-11.156211 5.578105-16.707368 0l-200.218948-255.838316c0-5.578105 0-11.129263 5.551158-11.129263l0.188632-1.643789c1.050947-3.907368 5.982316-3.907368 10.940631-3.907369l101.322106 37.99579 35.84 10.536421c-4.042105-157.776842 50.714947-281.007158 165.618526-365.729684 51.846737-35.462737 75.452632-94.396632 69.901474-183.376842l-0.080843-2.883369V77.446737h1.724632v-10.401684h92.26779z"/>
        </g>
    </g>

</svg>