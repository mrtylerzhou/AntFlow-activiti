<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .main { fill: #FF850A; }
            .white { fill: #FFFFFF; }
            /* 隔离遮罩层 */
            .mask-bg { fill: #FFFFFF; }
            /* 退回箭头线条样式 */
            .return-style { 
                fill: none; 
                stroke: #FFFFFF; 
                stroke-width: 3; 
                stroke-linecap: round; 
                stroke-linejoin: round; 
            }
        </style>
    </defs>

    <!-- 1. 审批人主体部分 (全系列保持一致) -->
    <g id="approver">
        <!-- 头部 -->
        <circle class="main" cx="32" cy="16" r="10"/>
        <!-- 身体 -->
        <path class="main" d="
            M14 47
            C14 35 22 28 32 28
            C42 28 50 35 50 47
            L50 50
            C50 52.5 48 54 45.5 54
            L18.5 54
            C16 54 14 52.5 14 50
            Z"/>
    </g>

    <!-- 2. 左下角：退回操作角标 -->
    <g transform="translate(16, 48)">
        <!-- 核心隔离层：白色圆圈，确保干净地切开人像侧面 -->
        <circle class="mask-bg" cx="0" cy="0" r="15" />
        
        <!-- 橙色底座圆 -->
        <circle class="main" cx="0" cy="0" r="12" />
        
        <!-- 白色退回箭头 (U型回转) -->
        <g transform="translate(1, 0)">
            <path class="return-style" d="M4 -4 C4 -4, 4 4, -4 4" />
            <path class="return-style" d="M-1 1 L-4 4 L-1 7" />
        </g>
    </g>

</svg>