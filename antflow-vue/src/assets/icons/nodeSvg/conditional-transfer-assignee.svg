<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .main { fill: #FF850A; }
            .white { fill: #FFFFFF; }
            /* 隔离遮罩层样式 */
            .mask-bg { fill: #FFFFFF; }
            /* 转办箭头线条样式 */
            .stroke-white { 
                fill: none; 
                stroke: #FFFFFF; 
                stroke-width: 3.2; 
                stroke-linecap: round; 
                stroke-linejoin: round;
            }
        </style>
    </defs>

    <!-- 1. 审批人主体部分 (居中平衡布局) -->
    <g id="approver">
        <!-- 头部 -->
        <circle class="main" cx="32" cy="16" r="10"/>
        <!-- 身体 -->
        <path class="main" d="
            M14 47
            C14 35 22 28 32 28
            C42 28 50 35 50 47
            L50 50
            C50 52.5 48 54 45.5 54
            L18.5 54
            C16 54 14 52.5 14 50
            Z"/>
    </g>

    <!-- 2. 左下角角标：条件过滤 (单纯的漏斗) -->
    <g transform="translate(14, 48)">
        <!-- 核心隔离层：半径 16，确保切开身体左侧 -->
        <circle class="mask-bg" cx="0" cy="0" r="16" />
        <!-- 橙色底座圆 -->
        <circle class="main" cx="0" cy="0" r="13" />
        <!-- 白色漏斗 -->
        <path class="white" d="
            M -6, -6 
            H 6 
            L 2, 0 
            V 5 
            L -2, 6 
            V 0 
            Z" />
    </g>

    <!-- 3. 右下角角标：任务转办 (单纯的转向箭头) -->
    <g transform="translate(50, 48)">
        <!-- 核心隔离层：半径 16，确保切开身体右侧 -->
        <circle class="mask-bg" cx="0" cy="0" r="16" />
        <!-- 橙色底座圆 -->
        <circle class="main" cx="0" cy="0" r="13" />
        <!-- 白色转向箭头 -->
        <g transform="translate(-1, -1)">
            <path class="stroke-white" d="M -2,0 Q -2,4 4,4" />
            <path class="stroke-white" d="M 1,1 L 4,4 L 1,7" />
        </g>
    </g>

</svg>