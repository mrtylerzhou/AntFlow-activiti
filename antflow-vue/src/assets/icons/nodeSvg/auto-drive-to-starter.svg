<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .main { fill: #FF850A; }
            .white { fill: #FFFFFF; }
            /* 实线：退回执行路径 */
            .line-solid { 
                fill: none; 
                stroke: #FF850A; 
                stroke-width: 3.5; 
                stroke-linecap: round; 
                stroke-linejoin: round; 
            }
            /* 虚线：退回条件触发 */
            .line-dashed { 
                fill: none; 
                stroke: #FF850A; 
                stroke-width: 3.5; 
                stroke-linecap: butt; 
                stroke-dasharray: 5 4; 
            }
            /* 隔离遮罩 */
            .mask-bg { fill: #FFFFFF; }
        </style>
    </defs>

    <!-- 1. 路径逻辑：从右往左 -->
    <g id="logic-path-to-initiator">
        <!-- 上方分支：触发条件（虚线） -->
        <path class="line-dashed" d="M52 20 H36 L28 32" />
        <!-- 下方分支：退回路径（实线） -->
        <path class="line-solid" d="M52 44 H36 L24 32" />
    </g>

    <!-- 2. 右侧核心：自动化驱动标识 (风扇) -->
    <g transform="translate(50, 32)">
        <circle class="mask-bg" cx="0" cy="0" r="14" />
        <circle class="main" cx="0" cy="0" r="11" />
        <g transform="rotate(45)">
            <path class="white" d="M0,0 L-2.5,-4.5 A3,3 0 0,1 2.5,-4.5 Z" transform="rotate(0)"/>
            <path class="white" d="M0,0 L-2.5,-4.5 A3,3 0 0,1 2.5,-4.5 Z" transform="rotate(90)"/>
            <path class="white" d="M0,0 L-2.5,-4.5 A3,3 0 0,1 2.5,-4.5 Z" transform="rotate(180)"/>
            <path class="white" d="M0,0 L-2.5,-4.5 A3,3 0 0,1 2.5,-4.5 Z" transform="rotate(270)"/>
        </g>
    </g>

    <!-- 3. 左侧核心：发起人 (目标终点) -->
    <g transform="translate(14, 32)">
        <!-- 隔离层：切开退回的实线 -->
        <circle class="mask-bg" cx="0" cy="0" r="15" />
        
        <!-- 发起人小人像 (比例缩小以符合Logo感) -->
        <g transform="translate(-10, -18) scale(0.65)">
            <circle class="main" cx="15" cy="10" r="8"/>
            <path class="main" d="
                M2 35
                C2 25 8 20 15 20
                C22 20 28 25 28 35
                L28 37
                C28 39 26 40 24 40
                L6 40
                C4 40 2 39 2 37
                Z"/>
        </g>
        
        <!-- 退回箭头尖端 (紧贴人像) -->
        <path class="main" d="M10 -6 L2 0 L10 6 L8 0 Z" />
    </g>

</svg>