<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .main { fill: currentColor; }
            .white-bg { fill: #FFFFFF; }
            
            /* 虚线主体样式 */
            .flow-line {
                fill: none;
                stroke: currentColor;
                stroke-width: 2.5;
                stroke-linecap: round;
                stroke-dasharray: 5, 5; /* 虚线长度和间距 */
                animation: dash-move 2s linear infinite; /* 开启跑马灯动画 */
            }

            /* 隔离层样式：比虚线粗，背景色，用于切开人物边缘 */
            .mask-line {
                fill: none;
                stroke: #FFFFFF;
                stroke-width: 7;
                stroke-linecap: round;
            }

            /* 动画定义：通过偏移量实现滚动效果 */
            @keyframes dash-move {
                from { stroke-dashoffset: 20; }
                to { stroke-dashoffset: 0; }
            }

            .stroke-main {
                fill: none;
                stroke: currentColor;
                stroke-width: 2.5;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
        </style>
    </defs>

    <!-- 1. 人物部分 -->
    <g id="character">
        <circle class="main" cx="28" cy="16" r="10"/>
        <path class="main" d="
            M10 47
            C10 35 18 28 28 28
            C38 28 46 35 46 47
            L46 50
            C46 52.5 44 54 41.5 54
            L14.5 54
            C12 54 10 52.5 10 50
            Z"/>
    </g>

    <!-- 2. 动态虚线箭头 -->
    <g id="arrow-animation">
        <!-- 底层隔离（遮罩）：防止虚线与身体重叠处显得脏 -->
        <path class="mask-line" d="M48 38 C 60 30, 60 10, 40 8" />
        
        <!-- 动画虚线层 -->
        <path class="flow-line" d="M48 38 C 60 30, 60 10, 40 8" />
        
        <!-- 箭头尖端 (固定在终点) -->
        <path class="main" d="M40 8 L45 5 L45 11 Z" />
    </g>

    <!-- 3. 右下角加号按钮 -->
    <g transform="translate(48, 48)">
        <!-- 隔离背景 -->
        <circle class="white-bg" cx="0" cy="0" r="13" />
        
        <!-- 按钮边框 -->
        <circle class="stroke-main" cx="0" cy="0" r="9" />
        
        <!-- 加号图标 -->
        <line class="stroke-main" x1="-4" y1="0" x2="4" y2="0" />
        <line class="stroke-main" x1="0" y1="-4" x2="0" y2="4" />
    </g>

</svg>