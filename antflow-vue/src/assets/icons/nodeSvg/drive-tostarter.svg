<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <defs>
        <style>
            .main { fill: #FF850A; }
            .white { fill: #FFFFFF; }
            /* 隔离遮罩层 */
            .mask-bg { fill: #FFFFFF; }
            /* 线条样式 */
            .stroke-white { 
                fill: none; 
                stroke: #FFFFFF; 
                stroke-width: 2.5; 
                stroke-linecap: round; 
                stroke-linejoin: round; 
            }
        </style>
    </defs>

    <!-- 1. 审批人主体部分 (全系列保持一致) -->
    <g id="approver">
        <!-- 头部 -->
        <circle class="main" cx="32" cy="16" r="10"/>
        <!-- 身体 -->
        <path class="main" d="
            M14 47
            C14 35 22 28 32 28
            C42 28 50 35 50 47
            L50 50
            C50 52.5 48 54 45.5 54
            L18.5 54
            C16 54 14 52.5 14 50
            Z"/>
    </g>

    <!-- 2. 左下角：退回至发起人角标 -->
    <g transform="translate(16, 48)">
        <!-- 核心隔离层：白色圆圈，确保干净地切开人像身体 -->
        <circle class="mask-bg" cx="0" cy="0" r="15" />
        
        <!-- 橙色底座圆 -->
        <circle class="main" cx="0" cy="0" r="12" />
        
        <!-- 发起人微缩符号 -->
        <g transform="translate(0, 1)">
            <!-- 发起人小头 -->
            <circle class="white" cx="0" cy="-4" r="3.5"/>
            <!-- 发起人小身体 -->
            <path class="white" d="M-6 5 C-6 1 -4 -1 0 -1 C4 -1 6 1 6 5 Z" />
            
            <!-- 退回箭头 (U型指向人) -->
            <path class="stroke-white" d="M6 -6 C8 -6, 8 -2, 6 1" />
            <path class="stroke-white" d="M8 -2 L6 1 L3 -1" />
        </g>
    </g>

</svg>